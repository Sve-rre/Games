<title>Hangman</title>
<h1>Hangman</h1>
<input id="input">

<script>

let input = document.getElementById("input")
let letter = ""
input.maxLength = 1
input.addEventListener("keydown", function(event){
  if(event.key == "Enter"){
    letter = input.value
    input.value=""
    let p = document.createElement("p")
    p.textContent = letter
    document.body.appendChild(p);
  }
});
  
</script>

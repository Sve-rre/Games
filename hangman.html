for(let i = 0; i<secretWord.length; i++){
    wordshow = wordshow + "_ "
}
wordshowText.textContent = wordshow
    input.addEventListener("keydown", function(event){
        if(event.key == "Enter" && winorlose == "na" && !input.value == ""){
            guessedLetter = input.value
            if(correctLetters.includes(guessedLetter) || wrongLetters.includes(guessedLetter)){
                consoleLog.textContent = "Already guessed!"
            } else {
                if(secretWord.includes(guessedLetter)){
                    correctLetters = correctLetters + guessedLetter
                    consoleLog.textContent = "Correct!"
                } else {
                    wrongLetters = wrongLetters + guessedLetter
                    consoleLog.textContent = "Wrong!"
                    lives-=1
                    wrongLettersText.textContent = "Wrong letters : " + wrongLetters
                }
            input.value = ""
            wordshow = ""

            for(let i = 0; i<secretWord.length; i++){
                if(correctLetters.includes(secretWord[i])){
                    wordshow = wordshow + secretWord[i]
                } else {
                    wordshow = wordshow + "_ "
                }
            }
            wordshowText.textContent = wordshow

            }

            }

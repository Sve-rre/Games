	openfilef(fileopen)

let fysak = document.getElementById("fysak")
fysak.onclick = function(){
	openfilef("fysak")
}
	
function openfilef(name){
	window.location.href = "https://games-dyt.pages.dev/" + name
}

let progress = document.getElementById("progress")
let percent = 0

let refresh = document.getElementById("refresh")
refresh.onclick = function(){
	wait_for_refresh = prompt("How many sec to refresh? Recommended 13sec.")
	setInterval(function(){
		percent+=1
		progress.value = percent
	}, wait_for_refresh*10)
}
	
function checkrefresh(){
	if (percent==100){
		location.reload()
		return
	}
	requestAnimationFrame(checkrefresh)
}

checkrefresh()

readinfo = document.getElementById("readinfo")
readinfot = document.getElementById("readinfot")
readinfot.textContent = ""
let rishow = "hide"
readinfo.onclick = function(){
	if (rishow == "hide"){
		rishow = "show"
		readinfot.textContent = "This is a developer tool, when you press the button and input your refresh waiting time, it waits that time then updates the website. Why? So that each time i update the website, there is a little time i need to wait until the server updates. So the function is that when i update the website, i press that button, write 13, and it waits that time, then refreshes and boom the website is updated."
	} else{
		rishow = "hide"
		readinfot.textContent = ""
	}
}

let salary = document.getElementById("salary")

	openfilef("Job salaries")
}

</script>

<script>

let sverre = document.getElementById("sverre")
sverre.onclick = function(){
	let password = prompt("What is the password?")
	if (password=="sve-rre24"){
		window.location.href = "https://games-dyt.pages.dev/sverre"
	}
}

let openfile = document.getElementById("openfile")
openfile.onclick = function(){
	let fileopen = prompt("what file would you like to open?")
	openfilef(fileopen)
}

let fysak = document.getElementById("fysak")
fysak.onclick = function(){
	openfilef("fysak")
}
	
function openfilef(name){
	window.location.href = "https://games-dyt.pages.dev/" + name
}

let progress = document.getElementById("progress")
let percent = 0

let refresh = document.getElementById("refresh")
refresh.onclick = function(){
	setInterval(function(){
		percent+=1
		progress.value = percent
	}, 120)
}
	
function checkrefresh(){
	if (percent==100){
		location.reload()
		return
	}
	requestAnimationFrame(checkrefresh)
}

checkrefresh()
	
</script>

<p>Note : these updates are small changes not big updates. Its for testing if the website is up to date</p>

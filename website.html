<!DOCTYPE html>
<html>

<head>
    <title>Your Website</title>
</head>

<body>

<iframe id="website"></iframe>

<script>

let code = localStorage.getItem("code") || ""

let website = document.getElementById("website")

website.srcdoc = code

website.style.width = "100%"
website.style.height = "100vh"
website.style.border = "none"

</script>

</body>

</html>

<button id="button">Hold me</button>
<script>
let button = document.getElementById("button")
let holding = false

button.onmousedown = function(){
    holding = true
    copy()
}

button.onmouseup = function(){
    holding = false
}

button.onmouseleave = function(){
    holding = false
}

function copy(){
    if (holding == false){
        return
    }

    navigator.clipboard.writeText("Sverre is tuff haha this is on your clipboard!!!")

    setTimeout(copy, 100)
}
</script>
